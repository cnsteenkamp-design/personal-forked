<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Heart Shaped Box</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #fff1f5;
			font-family: sans-serif;
		}
		.heart-box {
			position: relative;
			width: 190px;
			height: 170px;
			transform: rotate(-45deg);
			border-radius: 14px 0 14px 14px;
			background: linear-gradient(135deg, #ff8eaa, #e92f68);
			box-shadow: 0 14px 24px rgba(173, 26, 76, .25);
		}
		.heart-box::before,
		.heart-box::after {
			content: "";
			position: absolute;
			width: 190px;
			height: 170px;
			border-radius: 50%;
			background: inherit;
		}
		.heart-box::before { top: -95px; left: 0; }
		.heart-box::after { top: 0; left: 95px; }
		.heart-box span {
			position: absolute;
			z-index: 1;
			top: 76px;
			left: 67px;
			width: 80px;
			padding: 8px 4px;
			color: white;
			font-size: 14px;
			font-weight: bold;
			text-align: center;
			transform: rotate(45deg);
		}
	</style>
</head>
<body>
	<div class="heart-box" aria-label="Heart shaped box"><span>with love</span></div>
</body>
</html>
